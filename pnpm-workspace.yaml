allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': false
  better-sqlite3: true
  unrs-resolver: false

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@jorgebodega/*'

saveExact: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # TODO: remove once semver@6.3.1 (via @babel/core <- jest) is no longer in pnpm-lock.yaml; published manually without provenance after 7.x had it, verified against npm/node-semver
  - 'semver@6.3.1'
  # TODO: remove once @types/node moves past the 20.x line (its undici-types ~6.21.0); published manually by the undici lead maintainer without provenance, verified against nodejs/undici v6.21.0
  - 'undici-types@6.21.0'
