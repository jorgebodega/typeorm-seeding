allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': false
  better-sqlite3: true
  unrs-resolver: false

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@jorgebodega/*'
  # Renovate security update: @faker-js/faker@10.5.0
  - "@faker-js/faker@10.5.0"

saveExact: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # TODO: remove once semver@6.3.1 (via @babel/core <- jest) is no longer in pnpm-lock.yaml; published manually without provenance after 7.x had it, verified against npm/node-semver
  - 'semver@6.3.1'
